<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relacione os Itens 🧩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #00f5d4;
        }
        .painel {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            width: 90%;
            max-width: 700px;
        }
        .coluna {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .item {
            background: #16213e;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .item:hover {
            background: #0f3460;
            transform: scale(1.03);
        }
        .item.selecionado {
            border-color: #00f5d4;
            background: #0f3460;
        }
        .item.correto {
            background: #00b489;
            border-color: #00f5d4;
            cursor: default;
            pointer-events: none;
            animation: brilho 0.5s ease-out;
        }
        @keyframes brilho {
            0% { box-shadow: 0 0 0 rgba(0,245,212,0); }
            50% { box-shadow: 0 0 25px rgba(0,245,212,0.6); }
            100% { box-shadow: 0 0 0 rgba(0,245,212,0); }
        }
        .item.errado {
            animation: tremer 0.3s;
        }
        @keyframes tremer {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .status {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 10px 0;
            font-size: 17px;
            background: #16213e;
            padding: 15px 25px;
            border-radius: 12px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
        .mensagem {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            height: 30px;
        }

        /* 🎉 TELA DE VITÓRIA */
        .tela-vitoria {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: aparecer 0.5s ease-out;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .tela-vitoria h2 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            animation: pulo 0.6s ease-out infinite alternate;
        }
        @keyframes pulo {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .estatisticas {
            background: #16213e;
            padding: 25px 35px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
            font-size: 20px;
            line-height: 1.8;
        }
        .estatisticas span {
            color: #00f5d4;
            font-weight: bold;
        }

        /* 🎊 Confetes */
        .confete {
            position: fixed;
            width: 10px;
            height: 20px;
            opacity: 0.8;
            animation: cair 3s ease-in-out forwards;
        }
        @keyframes cair {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>🧩 Relacione os Pares!</h1>
    <p>Escolha um item da esquerda e depois seu par correspondente da direita</p>

    <!-- 📊 Painel de Estatísticas -->
    <div class="status">
        <div>✅ Acertos: <span id="acertos">0</span></div>
        <div>❌ Erros: <span id="erros">0</span></div>
        <div>🔄 Tentativas: <span id="tentativas">0</span></div>
        <div>📈 Acerto: <span id="porcentagem">0%</span></div>
    </div>

    <div class="painel">
        <div class="coluna" id="coluna-esq"></div>
        <div class="coluna" id="coluna-dir"></div>
    </div>

    <div class="mensagem" id="mensagem"></div>
    <button onclick="reiniciar()">🔄 Reiniciar Jogo</button>

    <!-- 🎉 Tela de Vitória (escondida até acertar tudo) -->
    <div class="tela-vitoria" id="telaVitoria">
        <h2>🎉 PARABÉNS! 🎉</h2>
        <div class="estatisticas">
            ✅ Pares encontrados: <span id="v-acertos">0</span> de <span id="v-total">0</span><br>
            ❌ Erros cometidos: <span id="v-erros">0</span><br>
            🔄 Tentativas feitas: <span id="v-tentativas">0</span><br>
            📈 Taxa de acerto: <span id="v-porcentagem">0%</span>
        </div>
        <button onclick="fecharVitoria()">Jogar Novamente 🔄</button>
    </div>

<script>
    // 🔧 Lista de pares — edite aqui seus itens!
    const pares = [
        { esq: "🌞 Sol", dir: "Dia" },
        { esq: "🌙 Lua", dir: "Noite" },
        { esq: "🌊 Mar", dir: "Água" },
        { esq: "🔥 Fogo", dir: "Calor" },
        { esq: "🌲 Árvore", dir: "Planta" },
        { esq: "❄️ Gelo", dir: "Frio" }
    ];

    let itensEsq = [];
    let itensDir = [];
    let selecionadoEsq = null;
    let selecionadoDir = null;
    let acertos = 0;
    let erros = 0;
    let tentativas = 0;

    function embaralhar(array) {
        return [...array].sort(() => Math.random() - 0.5);
    }

    function carregarJogo() {
        acertos = 0;
        erros = 0;
        tentativas = 0;
        selecionadoEsq = null;
        selecionadoDir = null;
        atualizarStatus();
        document.getElementById('mensagem').textContent = '';
        document.getElementById('telaVitoria').style.display = 'none';

        itensEsq = embaralhar(pares);
        itensDir = embaralhar(pares);

        const colEsq = document.getElementById('coluna-esq');
        const colDir = document.getElementById('coluna-dir');
        colEsq.innerHTML = '';
        colDir.innerHTML = '';

        itensEsq.forEach((par) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = par.esq;
            div.dataset.indiceReal = pares.indexOf(par);
            div.onclick = () => escolherEsq(div);
            colEsq.appendChild(div);
        });

        itensDir.forEach((par) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = par.dir;
            div.dataset.indiceReal = pares.indexOf(par);
            div.onclick = () => escolherDir(div);
            colDir.appendChild(div);
        });
    }

    function escolherEsq(el) {
        if (el.classList.contains('correto')) return;
        document.querySelectorAll('#coluna-esq .item').forEach(i => i.classList.remove('selecionado'));
        el.classList.add('selecionado');
        selecionadoEsq = el;
        verificarPar();
    }

    function escolherDir(el) {
        if (el.classList.contains('correto')) return;
        document.querySelectorAll('#coluna-dir .item').forEach(i => i.classList.remove('selecionado'));
        el.classList.add('selecionado');
        selecionadoDir = el;
        verificarPar();
    }

    function verificarPar() {
        if (!selecionadoEsq || !selecionadoDir) return;

        tentativas++;
        const iEsq = selecionadoEsq.dataset.indiceReal;
        const iDir = selecionadoDir.dataset.indiceReal;

        if (iEsq === iDir) {
            selecionadoEsq.classList.add('correto');
            selecionadoDir.classList.add('correto');
            acertos++;
            document.getElementById('mensagem').textContent = '✅ Par correto!';
            document.getElementById('mensagem').style.color = '#00f5d4';
        } else {
            selecionadoEsq.classList.add('errado');
            selecionadoDir.classList.add('errado');
            erros++;
            document.getElementById('mensagem').textContent = '❌ Tente novamente!';
            document.getElementById('mensagem').style.color = '#e94560';
            setTimeout(() => {
                selecionadoEsq.classList.remove('errado');
                selecionadoDir.classList.remove('errado');
            }, 300);
        }

        selecionadoEsq.classList.remove('selecionado');
        selecionadoDir.classList.remove('selecionado');
        selecionadoEsq = null;
        selecionadoDir = null;
        atualizarStatus();

        setTimeout(() => document.getElementById('mensagem').textContent = '', 1500);

        // 🎉 VERIFICA SE GANHOU
        if (acertos === pares.length) {
            setTimeout(mostrarVitoria, 600);
        }
    }

    function atualizarStatus() {
        document.getElementById('acertos').textContent = acertos;
        document.getElementById('erros').textContent = erros;
        document.getElementById('tentativas').textContent = tentativas;
        const porcent = tentativas > 0 ? Math.round((acertos / tentativas) * 100) : 0;
        document.getElementById('porcentagem').textContent = porcent + '%';
    }

    // 🎉 TELA DE VITÓRIA + CONFETES
    function mostrarVitoria() {
        const porcent = tentativas > 0 ? Math.round((acertos / tentativas) * 100) : 100;
        
        document.getElementById('v-acertos').textContent = acertos;
        document.getElementById('v-total').textContent = pares.length;
        document.getElementById('v-erros').textContent = erros;
        document.getElementById('v-tentativas').textContent = tentativas;
        document.getElementById('v-porcentagem').textContent = porcent + '%';

        document.getElementById('telaVitoria').style.display = 'flex';
        soltarConfetes();
    }

    function soltarConfetes() {
        const cores = ['#ffd700', '#00f5d4', '#e94560', '#00b489', '#ff6b81'];
        for (let i = 0; i < 100; i++) {
            setTimeout(() => {
                const conf = document.createElement('div');
                conf.className = 'confete';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
                conf.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3000);
            }, i * 30);
        }
    }

    function fecharVitoria() {
        document.getElementById('telaVitoria').style.display = 'none';
        carregarJogo();
    }

    function reiniciar() {
        carregarJogo();
    }

    window.onload = carregarJogo;
</script>
</body>
</html>
